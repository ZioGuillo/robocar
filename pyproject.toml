[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robocar"
version = "0.1.0"
requires-python = ">=3.10"
description = "Robot car controller — FastAPI web app for Raspberry Pi"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.2",
    "Pillow>=10.0.0",
]

[project.scripts]
robocar = "app.cli:main"

[tool.hatch.build]
include = ["app/**"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
